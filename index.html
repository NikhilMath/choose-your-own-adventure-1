      "Nobody suspects a thing. You are the most beloved employee in company history."
    ],
    "choices": [
      {
        "label": "Get in the van.",
        "hint": "It’s a long ride home.",
        "next": "guilt"
      }
    ]
  },
  "guilt": {
    "location": "Saturday · The back of the van",
    "title": "The guilt",
    "text": [
      "You should feel guilty. You do. You rationalize: the company wants happy employees. You are an employee. You are happy. Aren’t you?",
      "You canceled a retreat. You hired an actor. You lied to a man having an asthma attack. A balloon took a fake keyboard to space and everyone cried.",
      "Your phone buzzes. Daniel: “Thank you for today. You made it the best day in company history.”"
    ],
    "choices": [
      {
        "label": "Go home.",
        "hint": "You’ve been waiting for this for weeks.",
        "next": "home"

  "home": {
    "location": "10:48 p.m. · Kitchen table",
    "title": "The keyboard at home",
    "text": [
      "It’s on your kitchen table. It’s plugged in.",
      "No balloon. No cheering. The refrigerator hums. It’s very quiet."

    "choices": [

        "label": "Type your name.",
        "hint": "It’s what you did the first time.",

  "typing": {

  "ending": {

    "title": "The plateau",
    "ending": true,
    "text": [
      "The screen goes dark. You sit in a dark kitchen with a $150 keyboard that started a $100 million company and never went anywhere near space.",

    ]

};
const SAVE_KEY='keyboard-heist-v1';
let path=['arrival'];
let canSave=true;
function validPath(value){return Array.isArray(value)&&value.length>0&&value[0]==='arrival'&&value.every((id,i)=>Object.hasOwn(STORY,id)&&(i===0||STORY[value[i-1]].choices?.some(c=>c.next===id)));}
try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY));if(validPath(saved))path=saved;}catch{canSave=false;}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(path));canSave=true;}catch{canSave=false;}document.getElementById('save').textContent=canSave?'Progress saved on this browser':'Progress kept for this visit';}
function render(focus=false){
 const node=STORY[path.at(-1)];
 document.getElementById('chapter').textContent='CHAPTER '+String(path.length).padStart(2,'0')+' / YOUR JOURNEY';
 const container=document.getElementById('scene');container.replaceChildren();
 const tag=document.createElement('div');tag.className=node.ending?'ending-tag':'eyebrow';tag.textContent=node.location;container.append(tag);
 const title=document.createElement('h2');title.textContent=node.title;title.tabIndex=-1;container.append(title);
 const prose=document.createElement('div');prose.className='prose';node.text.forEach(text=>{const p=document.createElement('p');p.textContent=text;prose.append(p);});container.append(prose);
 if(node.ticket){
  const ticket=document.createElement('section');ticket.className='ticket';ticket.setAttribute('aria-label','Support ticket');
  for(const [label,value] of [['From',node.ticket.from],['Subject',node.ticket.subject]]){const row=document.createElement('p');const key=document.createElement('strong');key.textContent=label+': ';row.append(key,document.createTextNode(value));ticket.append(row);}
  const body=document.createElement('p');body.textContent=node.ticket.body;ticket.append(body);container.append(ticket);
 }
 if(node.afterTicket){const after=document.createElement('div');after.className='prose';node.afterTicket.forEach(text=>{const p=document.createElement('p');p.textContent=text;after.append(p);});container.append(after);}
 const prompt=document.createElement('p');prompt.className='decision';prompt.textContent=node.prompt||(node.checkpoint?'To be continued':node.ending?'Every ending is another beginning.':'What will you do?');container.append(prompt);
 const choices=document.createElement('div');choices.className='choices';
 (node.choices||(node.checkpoint?[]:[{label:'Discover another path',hint:'Return to the opening. Choose differently.',next:'arrival'}])).forEach((choice,i)=>{
 const button=document.createElement('button');button.className='choice'+(node.ending?' primary':'');
 const number=document.createElement('span');number.className='choice-number';number.textContent=node.ending?'↻':String(i+1).padStart(2,'0');number.setAttribute('aria-hidden','true');
 const copy=document.createElement('span');const label=document.createElement('strong');label.textContent=choice.label;const hint=document.createElement('small');hint.textContent=choice.hint;copy.append(label,hint);
 const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');button.append(number,copy,arrow);
 button.addEventListener('click',()=>{if(node.ending)path=['arrival'];else path.push(choice.next);render(true);});choices.append(button);
 });container.append(choices);
 document.getElementById('back').disabled=path.length===1;
 document.getElementById('count').textContent='· '+path.length+' scenes';
 const journey=document.getElementById('journey');journey.replaceChildren();path.forEach(id=>{const li=document.createElement('li');li.textContent=STORY[id].title;journey.append(li);});persist();
 if(focus)title.focus({preventScroll:true});
}
document.getElementById('back').addEventListener('click',()=>{if(path.length>1){path.pop();render(true);}});
document.getElementById('restart').addEventListener('click',()=>{if(path.length===1||confirm('Start a new journey? Your current path will be reset.')){path=['arrival'];render(true);}});
render();
</script>
</body>
